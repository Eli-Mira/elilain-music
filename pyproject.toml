[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elilain-music"
version = "0.2.0"
description = "Lain-themed local music downloader — YouTube, YouTube Music, SoundCloud, Spotify. Free for noncommercial use, high speed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Prosperity Public License 3.0" }
authors = [{ name = "Eli & Lain" }]
keywords = ["music", "downloader", "yt-dlp", "gui", "offline"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "yt-dlp>=2024.0.0",
    "PySide6>=6.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "requests>=2.32.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0", "httpx>=0.27.0"]

[project.gui-scripts]
elilain-music-gui = "elilain_music.gui.qml:main"

[project.scripts]
elilain-music = "elilain_music.cli:main"
elilain-music-web = "elilain_music.web:main"

[project.urls]
Homepage = "https://github.com/eli-lain/elilain-music"

[tool.setuptools.package-data]
elilain_music = ["assets/*.png", "assets/*.ico", "assets/*.md", "gui/quick/*.qml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["elilain_music*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]